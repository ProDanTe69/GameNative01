name: Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/utkarshdalal/GameNative.git
          git fetch upstream master

          if [ -z "$(git log --oneline HEAD..upstream/master)" ]; then
            echo "Already up to date"
            exit 0
          fi

          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search 'Sync with official in:title' --json number --jq length)" != "0" ]; then
            echo "A sync PR is already open"
            exit 0
          fi

          BASE=$(git rev-parse HEAD)
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          if git merge --no-edit upstream/master; then
            git push origin "$BRANCH"

            PATTERN='(^|/)(GraphicsTab|LsfgVkManager|ContainerData|PluviaMain)\.kt$'
            TOTAL=$(git diff --name-only "$BASE" HEAD | wc -l)
            HITS=$(git diff --numstat "$BASE" HEAD | awk '{print $1" "$2" "$3}' | grep -E "$PATTERN" || true)

            if [ -z "$HITS" ]; then
              TITLE="Sync with official ($(date +%Y-%m-%d))"
              BODY="Safe: none of your 4 protected files are changed. Files changed in total: $TOTAL. No conflicts."
            else
              LIST=$(echo "$HITS" | awk '{print "- " $3 " (+" $1 " / -" $2 ")"}')
              TITLE="Sync with official ($(date +%Y-%m-%d)) - PROTECTED FILES CHANGED"
              BODY=$(printf 'WARNING: this PR changes your protected files. Check Files changed before merging.\n\n%s\n\nFiles changed in total: %s. No conflicts.' "$LIST" "$TOTAL")
            fi

            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
              --title "$TITLE" --body "$BODY"
          else
            git merge --abort
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Upstream sync has conflicts ($(date +%Y-%m-%d))" \
              --body "Official has new commits that conflict with your mods. Merge manually using the update guide."
          fi
